<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - BBRY</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
   <!-- Header Component Placeholder -->
   <div id="header-placeholder"></div>
    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- Floating social icons -->
        <div class="floating-social">
            <a href="#" class="float-icon messenger"><i class="fab fa-facebook-messenger"></i></a>
            <a href="#" class="float-icon zalo"><i class="fas fa-comment"></i></a>
            <a href="#" class="float-icon whatsapp"><i class="fab fa-whatsapp"></i></a>
            <a href="#" class="float-icon top"><i class="fas fa-chevron-up"></i></a>
        </div>

        <!-- CONTACT BANNER -->
        <section class="contact-banner">
            <div class="banner-background">
                <img src="assets/banh1.jpg" alt="Contact">
            </div>
            <div class="banner-overlay"></div>
            <div class="banner-content">
                <h1>Liên Hệ</h1>
                <a href="#contact-form" class="contact-btn">Liên Hệ</a>
            </div>
        </section>

        <!-- CONTACT FORM SECTION -->
        <section class="contact-section" id="contact-form">
            <div class="container">
                <form class="contact-form">
                    <div class="form-grid">
                        <!-- Left Column -->
                        <div class="form-column">
                            <div class="form-group">
                                <label>Họ tên</label>
                                <input type="text" placeholder="Nhập họ tên" required>
                            </div>

                            <div class="form-group">
                                <label>Địa chỉ liên hệ</label>
                                <input type="text" placeholder="Nhập địa chỉ liên hệ" required>
                            </div>

                            <div class="form-group">
                                <label>Số điện thoại</label>
                                <input type="tel" placeholder="Nhập số điện thoại" required>
                            </div>

                            <div class="form-group">
                                <label>Ghi chú</label>
                                <input type="text" placeholder="Nhập ghi chú" required>
                            </div>
                        </div>

                        <!-- Right Column -->
                        <div class="form-column">
                            <div class="form-group">
                                <label>Địa chỉ quận</label>
                                <input type="text" placeholder="Nhập địa chỉ quận" required>
                            </div>

                            <div class="form-group">
                                <label>Địa chỉ quận</label>
                                <input type="text" placeholder="Nhập địa chỉ quận" required>
                            </div>

                            <div class="form-group">
                                <label>Số điện thoại quận</label>
                                <input type="tel" placeholder="Nhập số điện thoại quận" required>
                            </div>

                            <div class="form-group">
                                <label>Email-Website</label>
                                <input type="email" placeholder="Nhập email hoặc website" required>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="form-submit">
                        <button type="submit" class="confirm-btn">Xác nhận</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Footer Component Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Load Components -->
    <script src="components.js"></script>
</body>
</html>
