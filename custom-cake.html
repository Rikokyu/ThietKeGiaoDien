<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiết kế bánh - BBRY</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header Component Placeholder -->
    <div id="header-placeholder"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- Floating social icons -->
        <div class="floating-social">
            <a href="#" class="float-icon messenger"><i class="fab fa-facebook-messenger"></i></a>
            <a href="#" class="float-icon zalo"><i class="fas fa-comment"></i></a>
            <a href="#" class="float-icon whatsapp"><i class="fab fa-whatsapp"></i></a>
            <a href="#" class="float-icon top"><i class="fas fa-chevron-up"></i></a>
        </div>

        <!-- CUSTOM CAKE FORM -->
        <div class="custom-cake-container">
            <div class="container">
                <h1 class="form-title">Thiết kế bánh sinh nhật theo yêu cầu</h1>

                <form class="cake-form">
                    <!-- Image Section -->
                    <div class="form-section">
                        <div class="section-label">Gửi ảnh</div>
                        <div class="image-upload-box">
                            <div class="upload-area">
                                <i class="fas fa-camera"></i>
                                <p>Kéo thả hoặc nhấp để tải sinh khi</p>
                            </div>
                            <input type="file" class="file-input" accept="image/*">
                        </div>
                        <button type="button" class="upload-btn">Tải ảnh lên</button>
                    </div>

                    <!-- Description Section -->
                    <div class="form-section">
                        <div class="section-label">Mô tả</div>
                        <div class="description-content">
                            <div class="description-left">
                                <h3>Viết mô tả</h3>
                                <textarea class="description-input" placeholder="Nhập mô tả chi tiết về bánh bạn muốn..." rows="8"></textarea>
                            </div>

                            <div class="description-right">
                                <h3>Chọn size</h3>
                                <select class="size-select">
                                    <option value="15">15cm</option>
                                    <option value="20">20cm</option>
                                    <option value="25">25cm</option>
                                    <option value="30">30cm</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="form-submit">
                        <button type="submit" class="submit-btn">Gửi yêu cầu</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <!-- Footer Component Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Load Components -->
    <script src="components.js"></script>
</body>
</html>
